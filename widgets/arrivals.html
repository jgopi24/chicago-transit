<!DOCTYPE html>
<!-- arrivals.html — live countdown board.
     Params: __TITLE__ (e.g. "22 Clark — Clark/Adams"), __MODE__ (bus|train),
             __STOP__ ("stpid=8417" or "mapid=40380"), __ROUTE__ (optional),
             __API_BASE__ (connector URL). Refreshes every 20s. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;background:#0b1220;color:#eef2f7;padding:16px}
.card{background:#131c2e;border:1px solid #22304a;border-radius:14px;padding:16px;max-width:520px;margin:0 auto}
h1{font-size:17px;font-weight:700;margin-bottom:2px}
.sub{font-size:12px;color:#8ea0b8;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid #1e2a42}
.badge{min-width:46px;text-align:center;font-weight:800;font-size:14px;background:#1d5fb8;border-radius:8px;padding:6px 8px}
.badge.train{background:#b81d4e}
.main{flex:1;min-width:0}
.dest{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:#8ea0b8;margin-top:2px}
.time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.time small{font-size:12px;font-weight:600;color:#8ea0b8}
.due{color:#35d07f}.dly{color:#ff5d5d}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35d07f;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.foot{font-size:11px;color:#5c6f8a;margin-top:10px;text-align:right}
.empty{padding:24px;text-align:center;color:#8ea0b8;font-size:14px}
</style></head><body>
<div class="card">
  <h1>__TITLE__</h1>
  <div class="sub"><span class="live"></span>Live arrivals · updates every 20s</div>
  <div id="list"><div class="empty">Loading…</div></div>
  <div class="foot" id="stamp"></div>
</div>
<script>
const API="__API_BASE__", MODE="__MODE__", STOP="__STOP__", ROUTE="__ROUTE__";
const KEY=""; // injected if needed
async function load(){
  try{
    let url = MODE==="train"
      ? `${API}/api/train/arrivals?${STOP}&max=6`
      : `${API}/api/bus/arrivals?${STOP}&top=6`;
    if(ROUTE) url += `&rt=${encodeURIComponent(ROUTE)}`;
    const r = await fetch(url,{headers:KEY?{"X-API-Key":KEY}:{}});
    const d = await r.json();
    const items = d.arrivals||[];
    const el = document.getElementById("list");
    if(!items.length){ el.innerHTML='<div class="empty">No live predictions right now.<br>Predictions cover ~20–30 min out.</div>'; }
    else el.innerHTML = items.map(a=>{
      const cd = a.countdown || "";
      const isDue = /due/i.test(cd), isDly = a.delayed || /dly/i.test(cd);
      const t = isDue ? '<span class="due">DUE</span>'
            : isDly ? '<span class="dly">DLY</span>'
            : `${cd}<small> min</small>`;
      const dest = a.dest||"", meta = MODE==="train"
        ? `${a.station||""} · ${a.platform||""}${a.scheduled?" · scheduled":""}`.replace(/^ · /,"")
        : `${a.stop_name||""}${a.direction?" · "+a.direction:""}`;
      return `<div class="row"><div class="badge ${MODE}">${a.route||""}</div>
        <div class="main"><div class="dest">${dest}</div><div class="meta">${meta}</div></div>
        <div class="time">${t}</div></div>`;
    }).join("");
    document.getElementById("stamp").textContent =
      "Updated "+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById("list").innerHTML='<div class="empty">Could not reach the connector.</div>'; }
}
load(); setInterval(load,20000);
</script></body></html>
